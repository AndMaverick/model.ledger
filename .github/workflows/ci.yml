name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Command line smoke test
        run: python -m model_ledger --help
      - name: Example gate
        run: python -m model_ledger report examples/platform_team.json
      - name: Failing example must exit 1
        run: |
          set +e
          python -m model_ledger report examples/runaway_launch.json > /dev/null
          test "$?" -eq 1
      - name: Ledger digest
        run: python -m model_ledger digest examples/platform_team.json
      - name: Verification figures
        run: python examples/evaluate.py

  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: ruff check .
      - run: mypy
